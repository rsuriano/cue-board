<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mock: Generate with code (design only)</title></head>
<body>
<!--
  Design mock for docs/specs/generate-with-code.md. NOT app code: nothing here talks to OpenRouter or runs model code.
  It loads the real ../index.html (same tokens, fonts, components, phone layout), opens the example project on side B,
  and adds the new controls on top, in the state given by ?state=:
    code       B side, generation box switched to "Code" (desktop); the "Generate with code" entry (phone)
    sheet      phone only: the "Generate with code" sheet
    progress   a code take that is being written and recorded
    done       a finished code take: version list and "Ask for a change"
    error      a code take whose code failed
    settings   Settings, "Connect with OpenRouter" (not connected)
    connected  Settings, connected
  Serve the repo root over http (python3 -m http.server, or node server.mjs) and open /design/mock-codegen.html?state=done.
  Screenshots: node design/codegen-shots.mjs <repo-root> [out-dir]
-->
<template id="mockcss"><style>
/* the code icon follows the sprite: 16px grid, 1.5px stroke */
.cg-mode{display:grid;gap:var(--gap-label)}
.cg-mode>span{font-size:var(--text-sm);line-height:var(--lh-sm);font-weight:var(--w-medium);color:var(--ink-2)}
.cg-mode .sides{width:max-content}
.cg-hint{margin:0;color:var(--ink-3);font-size:var(--text-sm);line-height:var(--lh-sm)}
.cg-genrow{grid-template-columns:minmax(0,1fr)}
.cg-genrow .chk{grid-column:1/-1}
.cg-tokens{color:var(--ink-3)}
/* the take card while it works: steps, then the frame count */
.cg-steps{display:grid;gap:var(--sp-2);width:min(100%,320px);padding:var(--sp-4);margin:0;list-style:none;font-size:var(--text-sm);line-height:var(--lh-sm)}
.cg-steps li{display:grid;grid-template-columns:var(--icon-lg) minmax(0,1fr) auto;align-items:center;gap:var(--sp-2);color:var(--ink-4)}
.cg-steps li.done{color:var(--ink-3)}
.cg-steps li.now{color:var(--ink)}
.cg-steps li .ico{width:var(--icon-lg);height:var(--icon-lg)}
.cg-steps li.done .ico{color:var(--ok)}
.cg-steps .tc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.cg-steps .dot{justify-self:center;width:var(--icon-sm);height:var(--icon-sm);border-radius:var(--r-round);background:var(--border-strong)}
.cg-bar{grid-column:2/-1;height:var(--sp-1);border-radius:var(--r-xs);background:var(--surface-3);overflow:hidden}
.cg-bar b{display:block;height:100%;background:var(--accent)}
.tv canvas{width:100%;height:100%;display:block}
/* versions: one row per version; the row on screen is the active one */
.cg-vers{display:grid;gap:var(--sp-0-5);margin:0;padding:0;list-style:none}
.cg-vhrow{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:calc(var(--sp-1) * -1)}
.cg-vh{font-size:var(--text-sm);line-height:var(--lh-sm);font-weight:var(--w-medium);color:var(--ink-2)}
.cg-v{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--sp-3);width:100%;min-height:var(--h-md);padding:0 var(--sp-2);border:var(--hairline) solid transparent;border-radius:var(--r-sm);font-size:var(--text-sm);line-height:var(--lh-sm);color:var(--ink-2);cursor:pointer}
.cg-v:hover{background:var(--surface-2)}
.cg-v[aria-current="true"]{background:var(--accent-subtle);border-color:var(--accent-border);color:var(--ink)}
.cg-v[aria-current="true"] .cg-vn{color:var(--accent)}
.cg-vn{font:var(--w-semibold) var(--text-sm)/var(--lh-sm) var(--font-mono);color:var(--ink-3)}
.cg-vt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-vc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.cg-v .ok{color:var(--ok);font-family:var(--font-ui);font-weight:var(--w-medium)}
.cg-ask{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-2);align-items:center}
.cg-ask input{width:100%;height:var(--h-md);padding:0 var(--sp-3);background:var(--inset);border:var(--hairline) solid var(--border-control);border-radius:var(--r-sm);color:var(--ink);font-size:var(--text-input)}
.cg-ask input::placeholder{color:var(--ink-3)}
.cg-ask input:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 var(--hairline) var(--accent)}
.cg-ask .muted{grid-column:1/-1;margin:0;color:var(--ink-3);font-size:var(--text-sm);line-height:var(--lh-sm)}
.cg-err{display:grid;gap:var(--sp-2);justify-items:center;padding:var(--sp-4);text-align:center}
.cg-err b{display:inline-flex;align-items:center;gap:var(--sp-1-5);color:var(--error);font:var(--w-semibold) var(--text-md)/var(--lh-md) var(--font-ui)}
.cg-err b .ico{width:var(--icon-lg);height:var(--icon-lg)}
.cg-err code{max-width:100%;padding:var(--sp-1) var(--sp-2);background:var(--inset);border:var(--hairline) solid var(--border-subtle);border-radius:var(--r-xs);font:var(--w-regular) var(--text-sm)/var(--lh-sm) var(--font-mono);color:var(--ink-2);overflow-wrap:anywhere}
.cg-why{margin:0;font-size:var(--text-sm);line-height:var(--lh-sm);color:var(--ink-2)}
/* Settings: the OpenRouter row */
.cg-or{display:grid;gap:var(--gap-label)}
.cg-or>label,.cg-or>.cg-lbl{font-size:var(--text-sm);line-height:var(--lh-sm);font-weight:var(--w-medium);color:var(--ink-2)}
.cg-orrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3)}
.cg-orrow .grow{flex:1}
.cg-key{font:var(--w-regular) var(--text-sm)/var(--lh-sm) var(--font-mono);color:var(--ink-3)}
/* phone: the entry under the shot header, and the sheet */
.cg-mstart{display:grid;gap:var(--gap-label)}
.cg-mstart .btn{width:100%}
#cgSheet .sh{display:grid;gap:var(--gap-block)}
#cgSheet .gprompt>.field{display:flex;flex-wrap:wrap;gap:var(--gap-label);margin-bottom:var(--gap-label);font-weight:var(--w-semibold);color:var(--ink)}
#cgSheet textarea{width:100%;min-height:var(--h-prompt);background:var(--inset);border:var(--hairline) solid var(--border-control);border-radius:var(--r-sm);color:var(--ink)}
#cgSheet .genfoot .btn{flex:1 0 100%}
@media not all and (min-width:820px){
  .cg-mode .sides{width:100%}.cg-mode .sidetab{flex:1;justify-content:center}
  .cg-ask input{height:var(--hit)}
  .cg-v{min-height:var(--hit)}
  .cg-genrow{grid-template-columns:minmax(0,1fr)}
}
</style></template>

<!-- the example the spec uses for the contract: what the model returns, verbatim (one function) -->
<script type="text/plain" id="sampleCode">
function animation({ canvas, ctx, width, height, fps, duration, random, beats, energy, lib }) {
  // setup: runs once
  const steps = 5, stepH = height / steps;
  const prints = (beats.length ? beats : lib.grid(duration, 0.5)).map((t, i) => ({
    t, x: width * (0.18 + 0.64 * (i % 8) / 7) + (i % 2 ? 26 : -26), y: height * (0.9 - 0.11 * (i % 8)), r: random() * 0.3 - 0.15 }));
  return function draw(t) {
    ctx.fillStyle = '#10141f'; ctx.fillRect(0, 0, width, height);
    for (let i = 0; i < steps; i++) { ctx.fillStyle = i % 2 ? '#1a2133' : '#161c2b'; ctx.fillRect(0, i * stepH, width, stepH - 3); }
    const sway = 0.5 + 0.5 * Math.sin(t * 1.3), e = energy ? energy(t) : 0.5;
    const g = ctx.createRadialGradient(width * 0.08, height * 0.45, 10, width * 0.08, height * 0.45, width * (0.55 + 0.1 * sway));
    g.addColorStop(0, `rgba(240,150,60,${0.35 + 0.3 * e})`); g.addColorStop(1, 'rgba(240,150,60,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, width, height);
    for (const p of prints) {
      if (t < p.t) break;
      const a = Math.min(1, (t - p.t) * 6) * Math.max(0.25, 1 - (t - p.t) / 6);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = `rgba(236,226,206,${a})`;
      ctx.beginPath(); ctx.ellipse(0, 0, width * 0.012, width * 0.026, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  };
}
</script>

<script type="text/plain" id="mockjs">
(()=>{
const Q=new URLSearchParams(location.search),STATE=Q.get("state")||"code",SHOT=+(Q.get("shot")||2);
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const phone=()=>!matchMedia("(min-width:820px)").matches;
const icon=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
/* the new icon: code, in the sprite's style */
document.querySelector("svg symbol").parentNode.insertAdjacentHTML("beforeend",'<symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></symbol>');

const PROMPT="Footprints appear one by one on dark stone steps, one footprint on each beat. A warm torch glow sways from the left. Flat shapes, no people.";
const CHIPS=["on the beat","lyrics on screen","flat shapes","line drawing","slow and calm"];
const MODELS=["Claude Sonnet 5.5","Claude Opus 5.5","Claude Haiku 5.5"];

function formHTML(id){return `
  <div class="gprompt">
    <label class="field" for="${id}P">What the animation shows</label>
    <textarea id="${id}P" rows="4">${PROMPT}</textarea>
    <div class="chips">${CHIPS.map(c=>`<button type="button" class="chip">${c}</button>`).join("")}</div>
  </div>
  <p class="cg-hint">The model also gets this shot’s frame prompt, notes and frame size. The take fills the full shot (10.7 s) and records on this device.</p>
  <div class="genrow cg-genrow">
    <label>Model<select>${MODELS.map(m=>`<option>${m}</option>`).join("")}</select></label>
    <label class="chk"><input type="checkbox" checked> Follow the song’s beat (22 beats in this shot)</label>
  </div>
  <div class="genfoot">
    <span class="muted cg-tokens">About 7,000 tokens</span>
    <span class="est">≈ 0.08 USD</span>
    <button type="button" class="btn primary">${icon("code")}Generate with code</button>
  </div>`}

function modeSwitch(code){return `<div class="cg-mode"><span id="cgModeL">Make the take with</span>
  <div class="sides" role="tablist" aria-labelledby="cgModeL"><button type="button" class="sidetab" role="tab" aria-selected="${!code}">AI video</button><button type="button" class="sidetab" role="tab" aria-selected="${code}">${icon("code")}&nbsp;Code</button></div></div>`}

/* a frame of the sample animation, drawn here only to give the take a picture (the app runs it in the sandbox) */
function frameCanvas(t,warm){
  const [w,h]=[1280,720],cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d");
  let s=7;const random=()=>((s=(s*16807)%2147483647)/2147483647);
  const beats=Array.from({length:22},(_,i)=>0.3+i*0.47);
  const lib={grid:(d,st)=>Array.from({length:Math.floor(d/st)},(_,i)=>i*st)};
  const src=$("cgSample").textContent;const animation=new Function(src+";return animation")();
  animation({canvas:cv,ctx,width:w,height:h,fps:30,duration:10.7,random,beats,energy:t=>0.6+0.4*Math.sin(t*2),lib})(t);
  if(warm){ctx.fillStyle="rgba(255,190,120,.07)";ctx.fillRect(0,0,w,h)}
  return cv;
}

function takeShell(inner,body,cls=""){const n=document.createElement("div");n.className="take "+cls;n.innerHTML=`<div class="tv">${inner}</div><div class="tbody">${body}</div>`;return n}
const META=(v,cost)=>`<div class="tmeta"><span><b>Code</b> · Claude Sonnet 5.5 · v${v} · 10.7 s</span><span>${cost}</span></div>`;

function progressCard(){
  const inner=`<ol class="cg-steps" aria-label="Progress">
    <li class="done">${icon("check")}<span>Writing the code</span><span class="tc">3,912 tokens</span></li>
    <li class="done">${icon("check")}<span>Testing in the sandbox</span><span class="tc">3 frames</span></li>
    <li class="now"><span class="spin"></span><span>Recording</span><span class="tc">142 / 321</span><span class="cg-bar"><b style="width:44%"></b></span></li>
    <li><span class="dot"></span><span>Saving the take</span><span></span></li></ol><span class="badge">take 1</span>`;
  return takeShell(inner,`${META(1,"≈ 0.08 USD")}<div class="tp">${PROMPT}</div>
    <div class="row"><span class="muted cg-tokens">0:41 · records faster than real time</span><button type="button" class="btn small ghost" data-act="del">Stop</button></div>`);
}
function doneCard(){
  const n=takeShell(`<span class="badge">take 4</span>`,`${META(3,"0.09 USD")}
    <div class="cg-vhrow"><span class="cg-vh" id="cgVh">Versions</span><button type="button" class="btn small ghost">${icon("code")}Show code</button></div>
    <ul class="cg-vers" aria-labelledby="cgVh">
      <li><button type="button" class="cg-v" aria-current="true"><span class="cg-vn">v3</span><span class="cg-vt">warmer colours, slower glow</span><span class="cg-vc">0.09 USD</span></button></li>
      <li><button type="button" class="cg-v"><span class="cg-vn">v2</span><span class="cg-vt">bigger footprints</span><span class="cg-vc">0.10 USD</span></button></li>
      <li><button type="button" class="cg-v"><span class="cg-vn">v1</span><span class="cg-vt">first version</span><span class="cg-vc"><span class="ok">in cut</span> · 0.08 USD</span></button></li>
    </ul>
    <div class="cg-ask"><input aria-label="Ask for a change" placeholder="Ask for a change"><button type="button" class="btn">Send</button><p class="muted">For example “slower” or “warmer colours”. Makes v4 from v3: about 9,000 tokens, ≈ 0.10 USD.</p></div>
    <div class="row"><button type="button" class="btn small primary" data-act="use">Use in cut</button><button type="button" class="btn small ghost" data-act="dl">Download</button><button type="button" class="btn small ghost" data-act="del">Delete</button></div>`);
  n.querySelector(".tv").prepend(frameCanvas(6.1,true));return n;
}
function errorCard(){
  return takeShell(`<div class="cg-err"><b>${icon("alert")}The code failed</b><code>TypeError: Cannot read properties of undefined (reading 'x') · line 9 · frame 0 (0.0 s)</code></div><span class="badge">take 2</span>`,
    `${META(2,"0.10 USD")}<p class="cg-why">The app recorded nothing. “Fix it” sends the code and the error to the model for a new try (≈ 0.10 USD).</p>
    <div class="tp">Asked: bigger footprints</div>
    <div class="row"><button type="button" class="btn small primary">Fix it</button><button type="button" class="btn small ghost">${icon("code")}Show code</button><button type="button" class="btn small ghost" data-act="del">Remove</button></div>`);
}
/* an older AI video take of the same shot, so the code take sits next to the takes people know */
function oldTake(){const n=takeShell(`<span class="badge">take 1</span>`,`<div class="tmeta"><span><b>Wan 3.0</b> · 480p · 10 s · start</span><span>0.50 USD</span></div><div class="tp">The boots tiptoe forward step by step, in time with a slow beat. Static camera.</div>
  <div class="row"><button type="button" class="btn small primary" data-act="use">Use in cut</button><button type="button" class="btn small ghost">Next shot’s start</button><button type="button" class="btn small ghost" data-act="dl">Download</button><button type="button" class="btn small ghost" data-act="del">Delete</button></div>`);
  const im=document.querySelector("#fStartImg img");if(im){const c=im.cloneNode();c.style.cssText="width:100%;height:100%;object-fit:cover;display:block";n.querySelector(".tv").prepend(c)}return n}

function settings(connected){
  $("settingsb").click();
  const key=$("setKey").closest(".field");
  const row=document.createElement("div");row.className="cg-or";
  row.innerHTML=connected?`<span class="cg-lbl">OpenRouter</span>
    <div class="cg-orrow"><span class="status ok">Connected</span><span class="cg-key">key sk-or-v1-…a1f3</span><span class="grow"></span><button type="button" class="btn small ghost">Disconnect</button></div>
    <p class="hint">The key is only in this browser. To set a spending limit or delete the key, go to <button type="button" class="linkbtn">openrouter.ai/keys</button>.</p>`
   :`<span class="cg-lbl">OpenRouter</span>
    <div class="cg-orrow"><button type="button" class="btn">Connect with OpenRouter</button><span class="muted">No key yet</span></div>
    <p class="hint">Opens OpenRouter. You log in and approve there, then you come back here with a key. You do not copy anything.</p>`;
  key.before(row);
  key.querySelector("label").textContent="Or paste a key";
  if(connected){key.hidden=true;$("setTest").textContent="Test connection";$("setMsg").textContent="Works · 18.40 USD left"}
}

async function phoneSheet(){
  const d=document.createElement("dialog");d.id="cgSheet";d.className="sheet";d.setAttribute("aria-labelledby","cgSheetH");
  d.innerHTML=`<div class="sh"><div class="sh-top"><span class="grab" aria-hidden="true"></span><h3 id="cgSheetH">Generate with code</h3><span class="grow"></span><button type="button" class="btn ghost icon" aria-label="Close">${icon("x")}</button></div>${formHTML("cgM")}</div>`;
  document.body.appendChild(d);d.showModal();d.querySelector("textarea").blur();
}

async function go(){
  await new Promise(r=>{const t=setInterval(()=>{const n=$("projname");if(n&&/Mountain/.test(n.textContent)){clearInterval(t);r()}},100)});
  await document.fonts.ready;
  /* the example finishes loading after its name shows (and then goes to side A): wait for the song, then for side B */
  await new Promise(r=>{const t=setInterval(()=>{if($("audio").duration>0){clearInterval(t);r()}},100)});
  await wait(600);
  if(STATE==="settings"||STATE==="connected"){settings(STATE==="connected");await wait(100);document.activeElement.blur();document.documentElement.dataset.mock="ready";return}
  for(let k=0;k<50&&($("sideB").hidden||!document.querySelector("#bList .bitem"));k++){
    (phone()?document.querySelector('#mTabs [data-side="b"]'):document.querySelector('.sidetab[data-side="b"]')).click();await wait(200)}
  await wait(400);
  const items=[...document.querySelectorAll("#bList .bitem")];if(items[SHOT-1])items[SHOT-1].click();
  await wait(500);
  /* desktop: the generation box gets a mode switch; Code mode replaces its fields */
  const box=document.querySelector(".genbox");
  [...box.children].forEach(c=>c.hidden=true);
  box.insertAdjacentHTML("afterbegin",modeSwitch(true)+formHTML("cgD"));
  /* phone: the entry under the shot header (the generation box stays hidden there, as today) */
  const ent=document.createElement("div");ent.className="cg-mstart m-only";
  ent.innerHTML=`<button type="button" class="btn">${icon("code")}Generate with code</button><p class="cg-hint">Writes an animation for this shot. The video records on this phone.</p>`;
  document.querySelector(".bbar").after(ent);
  const c=$("bConn");c.className="status ok";c.textContent="Direct to OpenRouter";$("bCredits").textContent="18.40 USD";
  const tk=$("bTakes");
  if(STATE==="progress"){tk.replaceChildren(progressCard())}
  if(STATE==="done"){tk.replaceChildren(doneCard(),oldTake())}
  if(STATE==="error"){tk.replaceChildren(errorCard(),oldTake())}
  if(STATE==="sheet"&&phone())await phoneSheet();
  document.querySelectorAll("#bList .bitem")[SHOT-1].querySelector(".cv").textContent=STATE==="done"?"4 takes · in cut":STATE==="error"?"2 takes":STATE==="progress"?"1 take · working":"no takes";
  await wait(200);
  if(["progress","done","error"].includes(STATE)){
    if(phone()){const sb=$("sideB"),c=tk.firstElementChild;sb.scrollTop+=c.getBoundingClientRect().top-sb.getBoundingClientRect().top-12}
    else window.scrollTo(0,Math.max(0,tk.getBoundingClientRect().top+scrollY-(innerHeight-tk.firstElementChild.offsetHeight)+24));
  }
  if(document.activeElement)document.activeElement.blur();
  document.documentElement.dataset.mock="ready";
}
go();
})();
</script>

<script>
/* boot: the real app, with <base> so its relative URLs (fonts, example, collab.js) resolve from the repo root */
(async()=>{
  const app=await (await fetch("../index.html",{cache:"no-store"})).text();
  const css=document.getElementById("mockcss").innerHTML,js=document.getElementById("mockjs").textContent,sample=document.getElementById("sampleCode").textContent;
  const doc=app
    .replace("<head>",'<head><base href="../">')
    .replace("</body>",css+'<script type="text/plain" id="cgSample">'+sample+"<\/script><script>"+js+"<\/script></body>");
  document.open();document.write(doc);document.close();
})();
</script>
</body></html>
