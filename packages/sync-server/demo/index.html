<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cue Board sync demo</title>
<style>
body{font:14px/1.4 system-ui,sans-serif;margin:24px;background:#f6f5f2;color:#222}
h1{font-size:16px;margin:0 0 4px}p{margin:0 0 16px;color:#666}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pane{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px}
.pane[data-state=offline]{background:#f1f1f1}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}.bar b{flex:1}
.status{font-size:12px;padding:2px 8px;border-radius:10px;background:#eee}
.status[data-state=online]{background:#d8f3dc;color:#1b4332}.status[data-state=offline],.status[data-state=rejected]{background:#ffd6d6;color:#7a1010}
label{display:block;font-size:12px;color:#666;margin:8px 0 2px}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:6px;border:1px solid #ccc;border-radius:4px}
textarea{height:140px;resize:vertical}.err{color:#a00}
</style>
</head>
<body>
<h1>Cue Board sync demo</h1>
<p>Two editors, each with its own Y.Doc and connection to the server, on the first shot of the room. Take one offline, edit both, bring it back.</p>
<div class="panes">
  <section class="pane" id="p1">
    <div class="bar"><b>Editor 1</b><span class="status">…</span><button class="toggle" type="button">Go offline</button></div>
    <label>Shot title</label><input class="title" disabled>
    <label>Notes</label><textarea class="notes" disabled></textarea>
  </section>
  <section class="pane" id="p2">
    <div class="bar"><b>Editor 2</b><span class="status">…</span><button class="toggle" type="button">Go offline</button></div>
    <label>Shot title</label><input class="title" disabled>
    <label>Notes</label><textarea class="notes" disabled></textarea>
  </section>
</div>
<script type="module" src="dist/client.js"></script>
</body>
</html>
